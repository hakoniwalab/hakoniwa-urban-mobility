schema_version: 2
name: Golf Cart one-lap hotel loop
rate_hz: 50
start_delay_sec: 0.0
loop_count: 1

vehicles:
  - name: Car-1
    route_offset_m: 0.0

control:
  speed_m_s: 1.0
  lookahead_m: 2.5
  position_gain: 0.8
  wheelbase_m: 1.55
  max_steering_deg: 32.0

route:
  closed: true
  points:
