schema_version: 3
name: Shizuoka five-car formation loop
rate_hz: 50
start_delay_sec: 1.0
loop_count: forever

# This scenario is intentionally City-local. The points use ENU metres relative
# to the Shizuoka City World receipt origin (35.099382, 138.858781).
city_world:
  job_id: shizuoka-22203-lat35.099-lon138.859
  origin_latitude: 35.099382
  origin_longitude: 138.858781

road_surface:
  categories: [roadway, lane, intersection]
  vehicle_length_m: 2.60
  vehicle_width_m: 1.30
  safety_margin_m: 0.20
  minimum_turn_radius_m: 3.00

# The runtime support for lateral_offset_m is implemented in Step 8.2. Step 8.1
# consumes the same contract to validate and preview the intended formation.
vehicles:
  - {name: Car-1, route_offset_m: 0.0, lateral_offset_m: 0.0}
  - {name: Car-2, route_offset_m: -4.5, lateral_offset_m: 1.8}
  - {name: Car-3, route_offset_m: -4.5, lateral_offset_m: -1.8}
  - {name: Car-4, route_offset_m: -9.0, lateral_offset_m: 1.8}
  - {name: Car-5, route_offset_m: -9.0, lateral_offset_m: -1.8}

control:
  speed_m_s: 1.0
  lookahead_m: 2.5
  position_gain: 0.8
  wheelbase_m: 1.55
  max_steering_deg: 32.0

# A low-speed counter-clockwise loop inside the broad central intersection.
# It is a conservative first candidate: every planned vehicle swept footprint
# remains inside a PLATEAU roadway/lane/intersection polygon. The route preview
# was approved in the Three.js route preview on 2026-09-19.
route:
  closed: true
  approval_status: approved
