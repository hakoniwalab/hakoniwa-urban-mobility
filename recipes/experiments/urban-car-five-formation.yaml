id: urban-car-five-formation
title: Five scenario-controlled Golf Carts in Shizuoka
recipe_version: 0.1
status: experimental

inputs:
  business_pack_city_receipt:
    path: ../hakoniwa-business-pack/work/remote-operation/city-world-worker/jobs/shizuoka-22203-lat35.099-lon138.859/build/world/city-world-receipt.json

  ackermann_vehicles:
    types:
      - type: golf_cart
        mjcf: ../hakoniwa-mbody-registry/bodies/generic_ackermann_golf_cart/generated/model.minimal_world.xml
        contract: ../hakoniwa-mbody-registry/bodies/generic_ackermann_golf_cart/config/ackermann-forge.yaml
        view_model: ../hakoniwa-mbody-registry/bodies/generic_ackermann_golf_cart/generated/view-model.json
    vehicles:
      generated_from_route:
        scenario: recipes/scenarios/shizuoka-five-car-formation-loop.yaml
        type: golf_cart
        control_mode: external_python
        auto_start_scenario: true
        ground_clearance_m: 0.45

  ackermann_runtime:
    realtime_sync_cycle_msec: 2
    native_mujoco_viewer: false

  browser_visualization:
    enabled: true
    # Keep the Step 8.1 static route preview on 8000 while this runtime is tested.
    web_bridge_port: 8766
    http_port: 8001
    threejs_root: ../hakoniwa-threejs-drone

composition:
  output:
    recipe_id: urban-car-five-formation
