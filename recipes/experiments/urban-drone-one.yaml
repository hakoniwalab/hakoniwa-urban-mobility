version: 1
id: urban-drone-one

fleet_experiment:
  path: drone-one-fleet.yaml

city_world:
  receipt: ../../../hakoniwa-business-pack/work/remote-operation/city-world-worker/jobs/shizuoka-22203-lat35.099-lon138.859/build/world/city-world-receipt.json

drone:
  profile: eams-nominal-9kg
  # ENU pose applied to the Drone Core Fleet config immediately before start.
  # Pose-only changes do not require configure.
  spawn_pose_enu:
    east_m: 0.0
    north_m: 0.0
    up_m: 10.3
    yaw_deg: 0.0
  launch_area:
    mode: auto
    offset_m: [0.0, 0.0, 0.0]
    search_radius_m: 100.0

control:
  mode: ps4-rc

mission:
  path: ../../config/drone/city-one-mission.json

viewer:
  map_layout: bottom-left
  collider_overlay_default: false
