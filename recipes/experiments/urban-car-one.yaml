id: urban-car-one
title: One PS5-controlled Golf Cart in a recipe-selected City World
recipe_version: 0.1
status: experimental

# The route supplies the initial pose. Driving is owned by the PS5 RC sender.
scenarios:
  car: recipes/scenarios/golf-cart-demo-loop.yaml

inputs:
  # Replace only this receipt to select another City World. The composer reads
  # the MJCF, GLB, origin, extent, and coordinate systems from the receipt.
  business_pack_city_receipt:
    path: ../hakoniwa-business-pack/work/remote-operation/city-world-worker/jobs/hokkaido-01100-lat43.062-lon141.355/build/world/city-world-receipt.json

  ackermann_vehicles:
    types:
      - type: golf_cart
        mjcf: ../hakoniwa-mbody-registry/bodies/generic_ackermann_golf_cart/generated/model.minimal_world.xml
        contract: ../hakoniwa-mbody-registry/bodies/generic_ackermann_golf_cart/config/ackermann-forge.yaml
        view_model: ../hakoniwa-mbody-registry/bodies/generic_ackermann_golf_cart/generated/view-model.json
    vehicles:
      generated_from_route:
        scenario: recipes/scenarios/golf-cart-demo-loop.yaml
        type: golf_cart
        control_mode: ps5
        up_m: 4.6

  ackermann_runtime:
    realtime_sync_cycle_msec: 2
    native_mujoco_viewer: false

  browser_visualization:
    enabled: true
    web_bridge_port: 8765
    http_port: 8000
    threejs_root: ../hakoniwa-threejs-drone
    front_camera:
      position: [1.25, 0.0, 1.25]
      rpy: [0.0, 0.0, 0.0]
      fov: 72
      near: 0.1
      far: 500
      borderColor: "#ffffff"
      borderWidthPx: 3
      window:
        x: 0.70
        y: 0.70
        width: 0.28
        height: 0.28

composition:
  output:
    directory: work/urban-car-one
