id: urban-drone-car-rc
title: One Golf Cart loop with one PS4-controlled EAMS Hexa Drone
recipe_version: 0.1
status: experimental

scenarios:
  car: recipes/scenarios/golf-cart-demo-loop.yaml

inputs:
  business_pack_city_receipt:
    path: ../hakoniwa-business-pack/work/remote-operation/city-world-worker/jobs/hokkaido-01100-lat43.062-lon141.355/build/world/city-world-receipt.json

  ackermann_vehicles:
    types:
      - type: golf_cart
        mjcf: ../hakoniwa-mbody-registry/bodies/generic_ackermann_golf_cart/generated/model.minimal_world.xml
        contract: ../hakoniwa-mbody-registry/bodies/generic_ackermann_golf_cart/config/ackermann-forge.yaml
        view_model: ../hakoniwa-mbody-registry/bodies/generic_ackermann_golf_cart/generated/view-model.json
    vehicles:
      generated_from_route:
        scenario: recipes/scenarios/golf-cart-demo-loop.yaml
        type: golf_cart
        control_mode: external_python
        up_m: 4.6

  drone_mirrors:
    - name: Drone-1
      pdu_types: ../hakoniwa-drone-core/config/pdudef/drone-pdutypes.json
      mjcf_model: ../hakoniwa-drone-pro/tuning/vehicle/eams/generated/nominal-9kg/drone.xml
      mjcf_body: drone_base
      initial_position_mjcf: [5.0, -45.0, 7.0]
      restitution_coefficient: 0.3
      relative_normal_speed_threshold_mps: 0.2
      cooldown_sec: 0.1

  ackermann_runtime:
    realtime_sync_cycle_msec: 2

  browser_visualization:
    enabled: false

composition:
  output:
    recipe_id: urban-drone-car-rc
