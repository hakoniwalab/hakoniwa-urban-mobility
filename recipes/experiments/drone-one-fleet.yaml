version: 1

experiment:
  id: urban-drone-one

scale:
  drone_count: 1
  drones_per_process: auto
  process_count: 1

runtime:
  mode: native
  visualization: true
  show_runner_real_time_sync: true

# The Business Pack generator needs this compatibility scenario while it
# materializes the Fleet contracts. The Urban launcher replaces its show
# runner with apps/drone/city_fleet_mission.py.
scenario:
  type: hakoniwa-word
  word: HAKONIWA
  letter_width_m: 2.0
  letter_height_m: 4.0
  letter_gap_m: 0.9
  altitude_m: 2.0
  duration_sec: 6.0
  hold_sec: 0.0
  speed_m_s: 1.0
  timeout_sec: 120.0
  land: false

results:
  enabled: false
  directory: results
