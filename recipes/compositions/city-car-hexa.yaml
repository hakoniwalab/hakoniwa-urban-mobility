# City + Car + one Drone (docs/asset-contract.md): two Golf Carts driving the
# hotel loop autonomously (api route scenario; Car-2 follows Car-1 6 m behind)
# and one PS4-flown EAMS Hexa (rc) whose mirror body interacts with the Cars.
#   python tools/urban_assets.py register-city --receipt <city-world-receipt.json>
#   python tools/urban_mobility.py configure --composition recipes/compositions/city-car-hexa.yaml
#   python tools/urban_mobility.py start --composition recipes/compositions/city-car-hexa.yaml
schema: hakoniwa.composition/v1
id: city-car-hexa
world: shizuoka-22203-lat35.099-lon138.859
vehicles:
  - name: Car-1
    asset: golf-cart
    control: api
    params: {scenario: "${repo:hakoniwa-urban-mobility}/recipes/scenarios/golf-cart-demo-convoy.yaml"}
    spawn: {east_m: 45.0, north_m: 7.5, yaw_deg: 0.0}
  - name: Car-2
    asset: golf-cart
    control: api
    params: {scenario: "${repo:hakoniwa-urban-mobility}/recipes/scenarios/golf-cart-demo-convoy.yaml"}
    # 6 m behind Car-1 on the loop, facing along it.
    spawn: {east_m: 47.9, north_m: 2.5, yaw_deg: 130.0}
  - name: Drone-1
    asset: eams-hexa
    control: rc
    spawn: {east_m: 5.0, north_m: -45.0, yaw_deg: 0.0}
interactions:
  - {type: drone-mirror, drone: Drone-1}
