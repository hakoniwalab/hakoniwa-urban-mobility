# Plain World + FPV Drone (docs/asset-contract.md): the Master3X FPV Drone on
# the FPV training course, flown with a PS5 controller. Both Assets are owned
# by hakoniwa-fpv-drone (assets/). Place the Drone anywhere on the course;
# the spawn height lands it on the ground or on an obstacle top.
#   python tools/urban_mobility.py configure --composition recipes/compositions/plain-fpv-rc.yaml
#   python tools/urban_mobility.py start --composition recipes/compositions/plain-fpv-rc.yaml
schema: hakoniwa.composition/v1
id: plain-fpv-rc
world: fpv-training-course
vehicles:
  - name: Drone-1
    asset: fpv-drone-master3x
    control: rc
    spawn: {east_m: 0.0, north_m: 0.0, yaw_deg: 90.0}
