# ③-5 到着：sapporo-rotary-pickup と同じ乗車・ルートを、雪の日の World（sapporo-rotary-snow）で、路面 圧雪 0.25 で走る。
# 札幌駅南の道では、雪の停止案内（演出、横断歩道の 5 m 手前）で 3 秒止まる（guide-snow）。元のシナリオは変えていない。
# 札幌駅南口ロータリー (City sapporo-rotary): the 箱庭カート comes along
# 北5条手稲通, turns into the station's rotary and pulls in at the station-side
# Hakoniwa Shuttle stop, where three people wait; it goes round and out onto
# 北5条手稲通 eastwards, turns east of the stalls and, coming back west, pulls
# in at the stop on the south side by the open space (three stalls, a square)
# and lets them off on the pavement side; they walk to the stalls and the
# square. Then it goes back west. The rotary follows its
# OpenStreetMap centre line (a one-way service road); the route keeps clear of
# the City's walls and parts (checked against the ground heights, 0.5 m apart).
# The car runs the route (apps/car/scenario_executor.py); the people: section
# is the riders' side (apps/people/ride_plan.py).
schema_version: 2
meta:
  world: sapporo-rotary-snow
name: demo35-arrival-snow
rate_hz: 50
start_delay_sec: 0.0
loop_count: forever

vehicles:
  - name: Cart-1
    route_offset_m: 0.0

control:
  speed_m_s: 3.0     # the cart's top speed (11 rad/s wheels)
  lookahead_m: 4.0
  position_gain: 0.8
  wheelbase_m: 2.10
  max_steering_deg: 34.0

