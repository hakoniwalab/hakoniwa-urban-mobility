# ③-2 外壁点検（北西面、壁（リブの先端）から 3.0 m、突風＋接触で故障）
# 南塔の H から離陸し、外壁の外を地上約 50 m まで降りて、壁に平行に 12 m 点検して H に戻る（壁の最外部は塔の中心から 22.24 m）。
drones:
- name: Drone-1
  start_delay_sec: 20
  speed_m_s: 4
  # 突風の中では指定点にぴったり届かないので、到達の判定を緩める
  tolerance_m: 3
  # 飛行中に何かに触れたら、壁側のローターが止まる
  contact_fault:
    scale: 0.0
  loop_count: 1
  takeoff:
    rise_m: 10
    hold_sec: 2
  waypoints:
