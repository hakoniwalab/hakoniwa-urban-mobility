    east_m: 56.01
    north_m: 17.68
    up_m: 262
    yaw_deg: 315
  - name: down
    east_m: 56.01
    north_m: 17.68
    up_m: 60.0
    yaw_deg: 315
    hold_sec: 2
  - name: pass-start
    east_m: 64.49
    north_m: 9.19
    up_m: 60.0
    yaw_deg: 315
    hold_sec: 3
    wind:
      towards_deg: 315.0
      speed_m_s: 15.0
    zone_width_m: 10.0
    zone_height_m: 12
  - name: pass-end
    east_m: 56.01
    north_m: 0.71
    up_m: 60.0
    yaw_deg: 315
    speed_m_s: 1.5
    hold_sec: 2
  - name: away
    east_m: 47.52
    north_m: 9.19
    up_m: 60.0
    yaw_deg: 315
  - name: up
    east_m: 47.52
    north_m: 9.19
    up_m: 262
    yaw_deg: 315
  land:
    east_m: 89.25
