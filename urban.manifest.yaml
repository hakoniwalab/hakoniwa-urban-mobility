# The root manifest of hakoniwa-urban-mobility: what this repository is made
# of and the ports it uses, in one place. Tools read it through
# tools/urban_manifest.py; docs/urban-manifest.md explains every field.
#
# Paths are relative to this repository unless they start with a placeholder:
#   ${workspace}      the folder holding this repository and its sibling repositories
#   ${business_pack}  $HAKONIWA_WORKSPACE_ROOT, the Business Pack root
#   ${work}           $HAKONIWA_WORK_DIR, the Business Pack work directory (it can be relocated)
# ${business_pack} and ${work} come from the Hakoniwa Business Pack Workspace
# (hakoniwa-business-pack docs/hakoniwa-workspace-environment-ja.md); they are
# never guessed from the folder layout. Outside the Workspace a tool that needs
# them stops and names the command that enters it: in hakoniwa-business-pack,
# `python tools/workspace.py enter` (or `python tools/workspace.py run -- <command>`).
schema: hakoniwa.urban-manifest/v1
id: hakoniwa-urban-mobility
title: Hakoniwa Urban Mobility

# --- Contracts this repository publishes --------------------------------------------
contracts:
  asset:
    path: docs/asset-contract.md
    schemas: [hakoniwa.asset/v1, hakoniwa.composition/v1]
  city_world_job:
    path: schemas/city-world-job.yaml
    schemas: [hakoniwa.city-world-job/v1]
  manifest:
    path: docs/urban-manifest.md
    schemas: [hakoniwa.urban-manifest/v1]

# --- Assets (docs/asset-contract.md section 3.1) ------------------------------------
assets:
  suffix: .asset.yaml
  repository: assets                         # this repository's manifests (searched recursively)
  workspace: "${workspace}/*/assets"         # other repositories' manifests (top level only)
  user: "${work}/urban/assets"               # registered Cities (cities/) and Worlds (worlds/)
  city_world_jobs: "${work}/recipes/city-world-web-ui/runtime/jobs"   # the City World Web UI's jobs

# --- Example Compositions (section 5.7) ----------------------------------------------
# Urban Studio lists an example only while every Asset it names (its World,
# vehicles, fleets) is in the catalog, so examples appear as the workspace
# gains what they need (a City registered, a repository checked out).
compositions:
  repository: recipes/compositions           # this repository's examples (*.yaml)
  workspace: "${workspace}/*/assets"         # other repositories' examples (top level only)
  suffix: .composition.yaml                  # the file suffix of those
  user: "${work}/urban/compositions"         # Compositions saved in Urban Studio

# --- Urban Studio (section 5.7) --------------------------------------------------------
studio:
  state: "${work}/urban/studio"              # a background Urban Studio's pid, port, and log

# --- Worlds (section 6) --------------------------------------------------------------
worlds:
  default: plain-ground                      # the World of a Composition that selects none
  plain_ground: worlds/plain-ground.yaml

# --- Managed Recipes: the environment each route prepares (section 2.1) --------------
# Every route has one: configure first materializes what it declares.
recipes:
  car:
    path: recipes/usecases/urban-car-rc.yaml
    recipe_id: urban-car-rc
    use_case: car-rc
  integrated:
    path: recipes/experiments/urban-mobility-rc.yaml
    recipe_id: urban-mobility-rc
    use_case: drone-car-distributed
  # The routes whose own tool configures (drone_one.py, drone_fleet.py,
  # hakoniwa-fpv-drone tools/fpv.py): their Recipe only materializes the
  # repositories, Foundation, and Python packages first.
  drone:
    path: recipes/usecases/urban-drone-rc.yaml
    recipe_id: urban-drone-rc
    use_case: drone-rc
  fleet:
    path: recipes/usecases/urban-drone-fleet.yaml
    recipe_id: urban-drone-fleet
    use_case: drone-fleet
  fpv:
    path: recipes/usecases/urban-fpv-rc.yaml
    recipe_id: urban-fpv-rc
    use_case: fpv-rc

# --- Ports -----------------------------------------------------------------------------
# Every TCP port Urban listens on or connects to, with its default. A port is
# changed, highest first, by: the Composition or command-line value named in
# `set_by` (one run), the environment variable HAKONIWA_URBAN_PORT_<ID> (the id
# upper-cased, - as _), then the machine's overrides file below. A `fixed` port
# belongs to another component that does not take a new one yet; it is listed
# so nothing else takes it.
#
# The defaults are uncommon ports below the OS ephemeral ranges (Linux 32768+,
# macOS/Windows 49152+), clear of common services (8000, 8080, 8765: development
# servers, Docker containers, WSL port proxies), as hakoniwa-fpv-drone's 28000 /
# 28765. The Launcher's control endpoint is not listed: it binds a free port
# itself and records it in its session.
ports:
  urban-studio:
    default: 28090
    protocol: http
    purpose: the Urban Studio browser backend
    served_by: tools/urban_studio.py
    set_by: [--port]
  city-world-web-ui:
    default: 28008
    protocol: http
    purpose: the Business Pack City World Web UI that Urban Studio links to and checks
    served_by: hakoniwa-business-pack tools/recipe/city_world_web_ui.py
    fixed: true
  viewer-http:
    default: 28100
    protocol: http
    purpose: the workspace file server of the Three.js and Map viewers of a running simulation
    served_by: tools/workspace_http_server.py
    set_by: [composition viewer.http_port, --port]
  web-bridge:
    default: 28865
    protocol: websocket
    purpose: the standard WebBridge (integrated Car + Drone viewer, the Business Pack fleet bridge)
    served_by: hakoniwa-pdu-bridge-core WebBridge
    set_by: [composition viewer.web_bridge_port, --web-bridge-port]
  web-bridge-car:
    default: 28866
    protocol: websocket
    purpose: the WebBridge of a Car-only Composition
    served_by: hakoniwa-pdu-bridge-core WebBridge
    set_by: [composition viewer.web_bridge_port, --web-bridge-port]
  web-bridge-fleet:
    default: 28867
    protocol: websocket
    purpose: the WebBridge of a Drone fleet Composition
    served_by: hakoniwa-pdu-bridge-core WebBridge
    set_by: [composition viewer.web_bridge_port]

# Defaults of other tools that run in the same workspace: Urban's defaults stay clear of them.
reserved:
  - {port: 28000, owner: hakoniwa-fpv-drone, purpose: FPV Three.js viewer HTTP}
  - {port: 28765, owner: hakoniwa-fpv-drone, purpose: FPV Three.js viewer WebBridge}
  - {port: 28096, owner: hakoniwa-booth-studio, purpose: Booth Studio}
  - {port: 28097, owner: hakoniwa-environment-studio, purpose: Environment Studio}

# Machine-specific port changes: {ports: {<id>: <port>}}; missing is fine.
port_overrides: "${work}/urban/ports.yaml"
