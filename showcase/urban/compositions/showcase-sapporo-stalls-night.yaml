# Showcase: Sapporo Station south rotary on a snowy night (City
# sapporo-rotary-snow). A Hakoniwa Cart takes three people from the station-side
# stop to the stop on the south side of 北5条手稲通 (scenarios/showcase-sapporo-arrival.yaml),
# by twelve food stalls and two squares where staff and guests are
# (scenes/showcase-sapporo-stalls.yaml, run by the festival director); a
# Hakoniwa Car runs up and down the street (scenarios/showcase-sapporo-delivery.yaml).
# Turn on Night mode in the Viewer's panel for the lit stalls.
# 25 people (stall staff 12, guests 6, children 2, riders and stop staff 5): the
# People plant computes them on one core, and with more of them a Windows
# notebook (Core Ultra 7 155H) fell to RTF 0.5.
schema: hakoniwa.composition/v1
id: showcase-sapporo-stalls-night
world: sapporo-rotary-snow
vehicles:
- {name: Cart-1, asset: hakoniwa-cart, control: api, params: {scenario: "${repo:hakoniwa-business-pack}/work/urban/scenarios/showcase-sapporo-arrival.yaml"}, spawn: {east_m: 30.0, north_m: -62.8, yaw_deg: 186}}
