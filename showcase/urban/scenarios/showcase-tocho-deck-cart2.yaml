# other side: just past the destination (north-end), so it turns into the
# southbound east lane and meets Cart-1 in the opposite lane, and reaches
# the station after Cart-1 has left it. Its own scenario, so its stops do not pause Cart-1.
# The same dwells as Cart-1 (so the same lap time, 142 s) and a 35 s start:
# it reaches the station about 10 s after Cart-1 leaves (66 s) and leaves it
# about 10 s before Cart-1 is back (147 s), every lap.
