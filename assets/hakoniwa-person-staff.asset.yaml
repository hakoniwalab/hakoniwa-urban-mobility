# 箱庭人間 (Hakoniwa People): 店員. The body stays in hakoniwa-mbody-registry
# (bodies/hakoniwa_person); this manifest declares how Urban uses it. People
# join a Composition of Cars (tools/urban_people.py) and are moved from
# outside through the Hakoniwa People API (apps/people/hakoniwa_people.py).
schema: hakoniwa.asset/v1
id: hakoniwa-person-staff
kind: vehicle
category: person
version: 0.1.0
title: 箱庭人間（店員）
source:
  repository: hakoniwa-mbody-registry
simulator: hakoniwa-people
look:
  variant: staff
  scale: 1.0
model:
  physics: ${repo:hakoniwa-mbody-registry}/bodies/hakoniwa_person/generated/staff/model.xml
  visual: ${repo:hakoniwa-mbody-registry}/bodies/hakoniwa_person/generated/staff/view-model.json
preview:
  format: view-model
  path: ${repo:hakoniwa-mbody-registry}/bodies/hakoniwa_person/generated/staff/view-model.json
dimensions:
  width_m: 0.44
  length_m: 0.44
spawn:
  ground_clearance_m: 0.0
controls:
  external:
    # An outside program (an agent, a script) moves it by name through the
    # Hakoniwa People API (apps/people/hakoniwa_people.py).
    external: true
  api:
    # Rides a car as a car route scenario's people: section says
    # (apps/people/ride_plan.py): waits, gets on the car standing at its stop,
    # gets off at its destination. One process for everyone in the scenario.
    program: ${repo:hakoniwa-urban-mobility}/apps/people/ride_plan.py
    scope: composition
    args: ["${param.scenario}", "--people-pdu-def", "${runtime.pdu_def}",
           "--car-pdu-def", "${runtime.car_pdu_def}", "--log", "${runtime.ride_log}"]
    params:
      scenario: {type: path, required: true, kinds: [car-route-scenario]}
