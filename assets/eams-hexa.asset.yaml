# Asset manifest (docs/asset-contract.md) for the Urban-owned EAMS Hexa.
schema: hakoniwa.asset/v1
id: eams-hexa
kind: vehicle
category: drone
version: 0.1.0
title: Urban EAMS Hexa (nominal 9 kg, 6 rotors)
source:
  repository: hakoniwa-urban-mobility
  # Drone profile understood by tools/drone_one.py.
  profile: eams-nominal-9kg
simulator: drone-core
model:
  physics: ${repo:hakoniwa-urban-mobility}/config/drone/hexa/drone.xml
  dynamics: ${repo:hakoniwa-urban-mobility}/config/drone/hexa/drone_config_0.json
# Urban Studio preview (tools/asset_preview.py): the Viewer's display model.
preview:
  format: drone-type
  path: ${repo:hakoniwa-threejs-drone}/config/drone_types-hexa-eams.json
  type: hexa_eams
spawn:
  # The landing collider bottom is 0.48 m below the base frame
  # (drone_one.py EAMS_LANDING_COLLIDER_POSITION/SIZE).
  ground_clearance_m: 0.5
interactions:
  # Mirror body of this Drone inside the Car world (asset-contract 5.3).
  drone-mirror:
    pdu_types: ${repo:hakoniwa-drone-core}/config/pdudef/drone-pdutypes.json
    mjcf_model: ${repo:hakoniwa-urban-mobility}/config/drone/hexa/drone.xml
    mjcf_body: drone_base
controls:
  rc:
    program: ${repo:hakoniwa-drone-core}/drone_api/rc/rc-custom.py
    scope: vehicle
    cwd: ${repo:hakoniwa-drone-core}/drone_api
    args: ["${runtime.pdu_def}", "${repo:hakoniwa-drone-core}/drone_api/rc/rc_config/ps4-control.json",
           "--name", "${vehicle.name}", "--index", "${vehicle.index}"]
  api:
    program: ${repo:hakoniwa-urban-mobility}/apps/drone/city_fleet_mission.py
    scope: vehicle
    cwd: ${repo:hakoniwa-urban-mobility}
    args: ["--drone-root", "${runtime.drone_root}",
           "--service-config", "${runtime.service_config}",
           "--city-marker", "${runtime.city_marker}",
           "--mission", "${param.mission}",
           "--summary-json", "${runtime.summary_json}"]
    params:
      mission: {type: path, required: true, kinds: [drone-mission]}
  schedule:
    # A flight on Hakoniwa time from a schedule (apps/drone/drone_schedule.py):
    # the drones: section of a route scenario (Cars, people and the Drone in
    # one file) or of a file of its own.
    program: ${repo:hakoniwa-urban-mobility}/apps/drone/drone_schedule.py
    scope: vehicle
    cwd: ${repo:hakoniwa-urban-mobility}
    args: ["--schedule", "${param.schedule}", "--drone", "${vehicle.name}",
           "--drone-root", "${runtime.drone_root}",
           "--service-config", "${runtime.service_config}",
           "--city-marker", "${runtime.city_marker}",
           "--summary-json", "${runtime.summary_json}",
           "--pdu-def", "${runtime.pdu_def}"]
    params:
      schedule: {type: path, required: true, kinds: [car-route-scenario, drone-schedule]}
