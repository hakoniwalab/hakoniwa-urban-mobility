schema: hakoniwa.asset/v1
id: hakoniwa-car2
kind: vehicle
category: car
version: 0.1.0
title: Hakoniwa Car 2（ダークグレー）
source: {repository: hakoniwa-mbody-registry, generator: "python bodies/hakoniwa_car2/config/build_model.py && python tools/ackermann/forge.py hakoniwa_car2"}
simulator: ackermann-mujoco
# The highway vehicles (hakoniwa-scenario): not in the Windows portable package,
# and they do not widen the route wall clearance of the existing city routes.
portable: false
route_clearance: false
model:
  physics: ${repo:hakoniwa-mbody-registry}/bodies/hakoniwa_car2/generated/model.minimal_world.xml
  contract: ${repo:hakoniwa-mbody-registry}/bodies/hakoniwa_car2/config/ackermann-forge.yaml
  visual: ${repo:hakoniwa-mbody-registry}/bodies/hakoniwa_car2/generated/view-model.json
preview: {format: view-model, path: "${repo:hakoniwa-mbody-registry}/bodies/hakoniwa_car2/generated/view-model.json"}
dimensions: {width_m: 1.78, length_m: 4.38}
spawn: {ground_clearance_m: 0.31}
# Where a 箱庭人間 sits (vehicle frame, x forward, y left, z up from the body
# origin; the hip on the seat): the driver on the right (right-hand drive),
# under the driver's eye (viewer.front_camera).
seats:
  driver: [-0.40, -0.38, -0.12]
  passenger: [-0.40, 0.38, -0.12]
viewer:
  front_camera: &driver_camera
    position: [-0.05, -0.38, 0.84]
    rpy: [0, 0, 0]
    fov: 72
    near: 0.1
    far: 1000
    borderColor: "#ffffff"
    borderWidthPx: 3
    window: {x: 0.70, y: 0.70, width: 0.28, height: 0.28}
controls: &controls
  external: {external: true}
  rc:
    program: ${repo:hakoniwa-urban-mobility}/apps/car/ps5_ackermann_sender.py
    scope: vehicle
    args: ["--pdu-def", "${runtime.pdu_def}", "--rc-config", "${runtime.rc_config}", "--robot", "${vehicle.name}",
           "--pdu", "ackermann_cmd", "--max-speed", "${param.max_speed}", "--max-steering-angle", "${param.max_steering_angle}", "--deadzone", "${param.deadzone}"]
    params: {max_speed: {type: number, default: 41.67}, max_steering_angle: {type: number, default: 0.60}, deadzone: {type: number, default: 0.06}}
  api:
    program: ${repo:hakoniwa-urban-mobility}/apps/car/scenario_executor.py
    scope: composition
    args: ["${param.scenario}", "--pdu-def", "${runtime.pdu_def}", "--tires", "${runtime.tires}", "--track", "${runtime.track}"]
    params: {scenario: {type: path, required: true, kinds: [car-route-scenario]}}
